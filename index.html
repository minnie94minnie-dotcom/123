    <div><h1 class="text-xs font-tech font-bold text-cyan-300 tracking-wider">SMARTSTAGER AI AR</h1><p class="text-[10px] text-gray-400">3D 自由沙盒・客廳</p></div>
  </div>
  <div class="glass px-2 py-1 rounded-full flex items-center space-x-1.5"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span><span class="text-[10px] font-tech text-emerald-400">SANDBOX</span></div>

    <button data-v="ov" class="vb gb w-9 h-9 rounded-xl text-cyan-300" title="客廳全景"><i class="fa-solid fa-cube"></i></button>

    <button data-v="sofa" class="vb gb w-9 h-9 rounded-xl text-cyan-300" title="沙發視角"><i class="fa-solid fa-eye"></i></button>

  </div>

</main>

<footer class="z-20 w-full glass border-t border-cyan-500/30 rounded-t-3xl">
  <div id="tg" class="w-full py-2 flex flex-col items-center cursor-pointer">
    <div class="w-12 h-1 bg-cyan-500/40 rounded-full mb-1"></div>
    <div class="flex items-center space-x-4 text-[11px] text-gray-300">
      <span><i class="fa-solid fa-couch text-cyan-400 mr-1"></i>家具 <b class="font-tech text-white" id="s-n">0</b></span>
      <span><i class="fa-solid fa-vector-square text-emerald-400 mr-1"></i>佔地 <b class="font-tech text-white" id="s-a">0%</b></span>
      <span><i class="fa-solid fa-tag text-amber-400 mr-1"></i><b class="font-tech text-white" id="s-p">NT$ 0</b></span>
    </div>
  </div>
  <div id="bd">
    <div class="px-3 pb-2 flex space-x-1 border-b border-slate-800">
      <button data-tab="furn" class="gb on flex-1 py-1.5 rounded-lg text-xs text-cyan-300"><i class="fa-solid fa-couch block text-sm mb-0.5"></i>家具庫</button>
      <button data-tab="ai" class="gb flex-1 py-1.5 rounded-lg text-xs text-gray-400"><i class="fa-solid fa-wand-magic-sparkles block text-sm mb-0.5"></i>AI 佈置</button>
      <button data-tab="sun" class="gb flex-1 py-1.5 rounded-lg text-xs text-gray-400"><i class="fa-solid fa-sun block text-sm mb-0.5"></i>光照</button>

        </div>

      </div>
      <div data-pn="sun" class="hidden space-y-3">
        <div class="text-xs text-gray-300 flex justify-between"><span>陽台落地窗日照 (06:00 - 18:00)</span><span id="sun-t" class="font-tech text-yellow-400">14:00</span></div>
        <input type="range" id="sun-r" min="6" max="18" step="0.5" value="14" class="w-full accent-yellow-400">

      </div>
      <div data-pn="room" class="hidden space-y-3 text-xs">

        <div class="grid grid-cols-4 gap-2">

          <button id="b-load" class="gb rounded-lg py-1.5 text-cyan-300">讀取</button>
          <button id="b-json" class="gb rounded-lg py-1.5 text-cyan-300">匯出</button>
          <button id="b-clr" class="gb rounded-lg py-1.5 text-rose-400">清空</button>
        </div>
      </div>
    </div>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
const GLB = 'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets@main/Models/SheenChair/glTF-Binary/SheenChair.glb';
// glb: 有檔案就載入真實模型；找不到時自動改用內建程序化家具 (w/d 單位 cm)
const FURN = [
  {id:'sheen-chair', n:'北歐絲絨單人椅', price:5800, glb:GLB, sc:1, w:85, d:80, t:'chair', c:'#A37A5C', ic:'fa-chair'},
  {id:'sectional-sofa-xmh9ay', n:'當代 L 型組合沙發', price:45800, glb:'An_L-shaped _modular_ sectional_sofa.glb', sc:2.6, off:180, w:260, d:164, t:'sofa', c:'#D9D4CC', ic:'fa-couch'},
  {id:'sectional-light-xmh9ay', n:'木製三腳架落地燈', price:8200, glb:'A_floor_lamp_with_a_wooden_tripod_base.glb', sc:1.3, w:50, d:50, t:'lamp', c:'#b08a5a', ic:'fa-lightbulb'},
  {id:'sectional-caffe-table-xmh9ay', n:'洞石雕塑茶几', price:28800, glb:'An_oval_coffee_table_crafted_from.glb', sc:2, w:120, d:70, t:'table', c:'#D6CFC7', ic:'fa-circle'},
  {id:'sectional-media_console-xmh9ay', n:'現代漆面電視櫃', price:29990, glb:'A_sleek_modern media_console _with_a.glb', sc:2.6, w:180, d:45, t:'tv', c:'#A8B0BA', ic:'fa-tv'},
  {id:'sectional-floating_wall-mounted-xmh9ay', n:'極簡壁掛電視櫃', price:39990, glb:'A_modern_ floating_wall-mounted.glb', sc:2.6, w:200, d:35, t:'tv', c:'#C9C5BD', lift:.35, ic:'fa-tv'}
];
const DEF = [FURN[4].id, FURN[1].id, FURN[3].id, FURN[0].id, FURN[2].id];
const TXT = {
  cozy:'溫馨影音家庭：電視櫃貼後牆，L 型沙發與之相對，茶几居中，單椅與落地燈圍出聊天角落。',
  minimalist:'北歐極簡：家具貼牆擺放，沙發靠左牆，中央保留最大動線，落地燈收在角落。',
  lounge:'悠閒下午茶：沙發與單椅斜角對談，茶几居中，電視退到側牆，營造放鬆氛圍。'
};
const room = {w:5, d:4, H:2.4}, BAL = 2.2;
let scene, camera, renderer, controls, roomG, sun, amb, selBox, sel = null, uid = 0, drag = null, down = null, tw = null, warned = false;
const items = [], gl = new THREE.GLTFLoader(), cache = {}, bad = new Set();
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0), hit = new THREE.Vector3();
const fOf = o => FURN.find(f => f.id === o.userData.fid);

function toast(m){const e=$('ts');e.textContent=m;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2800)}

/* ---------- 場景 ---------- */
function init(){
  const box=$('cv');
  scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1120);scene.fog=new THREE.FogExp2(0x0b1120,.03);
  camera=new THREE.PerspectiveCamera(50,box.clientWidth/box.clientHeight,.1,100);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
  box.appendChild(renderer.domElement);
  controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2-.05;controls.minDistance=1;controls.maxDistance=14;
  amb=new THREE.AmbientLight(0xffffff,1.2);scene.add(amb);
  sun=new THREE.DirectionalLight(0xfff1dd,2.2);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.001;
  Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:.5,far:30});scene.add(sun);
  const fill=new THREE.DirectionalLight(0xbae6fd,1);fill.position.set(-5,3,-5);scene.add(fill);
  const grid=new THREE.GridHelper(40,40,0x00f0ff,0x1e293b);grid.position.y=-.02;scene.add(grid);
  roomG=new THREE.Group();scene.add(roomG);
  selBox=new THREE.Box3Helper(new THREE.Box3(),0x00f0ff);selBox.visible=false;scene.add(selBox);
  buildRoom();setSun(14);
  camera.position.set(0,3.6,room.d/2+3.4);controls.target.set(0,.5,0);
  bindInput();
  new ResizeObserver(()=>{camera.aspect=box.clientWidth/box.clientHeight;camera.updateProjectionMatrix();renderer.setSize(box.clientWidth,box.clientHeight)}).observe(box);
  renderer.setAnimationLoop(()=>{
    if(tw){tw.k=Math.min(1,tw.k+.04);const e=tw.k*tw.k*(3-2*tw.k);camera.position.lerpVectors(tw.p0,tw.p1,e);controls.target.lerpVectors(tw.t0,tw.t1,e);if(tw.k>=1)tw=null}
    if(sel)selBox.box.setFromObject(sel);
    controls.update();renderer.render(scene,camera);
  });
}

function floorTex(){
  const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
  x.fillStyle='#f0d3b1';x.fillRect(0,0,512,512);x.strokeStyle='#d4b38a';x.lineWidth=1.5;
  for(let y=0;y<512;y+=32){x.beginPath();x.moveTo(0,y);x.lineTo(512,y);x.stroke();
    for(let u=(y/32%3)*40;u<512;u+=120){x.beginPath();x.moveTo(u,y);x.lineTo(u,y+32);x.stroke()}}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(room.w*1.5,room.d*1.5);return t;
}

function buildRoom(){
  while(roomG.children.length)roomG.remove(roomG.children[0]);
  const {w:W,d:D,H}=room,wz=D*.55,sw=(D-wz)/2,
  wm=new THREE.MeshStandardMaterial({color:0xf3f4f6,roughness:.9}),
  gm=new THREE.MeshStandardMaterial({color:0xbfe6ff,transparent:true,opacity:.2,side:THREE.DoubleSide}),
  fm=new THREE.MeshStandardMaterial({color:0x1e293b,metalness:.8,roughness:.5}),
  P=(w,h,m,x,y,z,rx,ry)=>{const o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);o.position.set(x,y,z);o.rotation.set(rx||0,ry||0,0);o.receiveShadow=true;roomG.add(o)},
  B=(w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;roomG.add(o)};
  P(W,D,new THREE.MeshStandardMaterial({map:floorTex(),roughness:.35}),0,0,0,-Math.PI/2);
  P(W,H,wm,0,H/2,-D/2);P(D,H,wm,-W/2,H/2,0,0,Math.PI/2);
  P(sw,H,wm,W/2,H/2,D/2-sw/2,0,-Math.PI/2);P(sw,H,wm,W/2,H/2,-D/2+sw/2,0,-Math.PI/2);
  P(wz,H,gm,W/2,H/2,0,0,-Math.PI/2);
  [-wz/2,0,wz/2].forEach(z=>B(.08,H,.1,fm,W/2,H/2,z));B(.1,.1,wz,fm,W/2,H,0);
  P(BAL,wz,new THREE.MeshStandardMaterial({color:0x8ea3b8,roughness:.85}),W/2+BAL/2,0,0,-Math.PI/2);
  B(.05,1.1,wz,gm,W/2+BAL,.55,0);[-1,1].forEach(s=>B(BAL,1.1,.05,gm,W/2+BAL/2,.55,s*wz/2));B(.1,.05,wz,fm,W/2+BAL,1.1,0);
}

function setSun(h){
  const a=(h-6)/12*Math.PI,s=Math.max(0,Math.sin(a));
  sun.position.set(8,1.5+6*s,-5*Math.cos(a));sun.intensity=.3+2.2*s;
  sun.color.set(0xff9a55).lerp(new THREE.Color(0xfff6e8),Math.min(1,s*1.4));amb.intensity=.6+.8*s;
  $('sun-t').textContent=`${Math.floor(h)}:${h%1?'30':'00'}`;$('sun-i').textContent=Math.round(s*100)+'%';
}

/* ---------- 程序化家具 (GLB 找不到時的備援) ---------- */
function proc(f){
  const g=new THREE.Group(),W=f.w/100,D=f.d/100;
  const B=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.8}));m.position.set(x,y,z);g.add(m);return m};
  const col=f.c;
  if(f.t==='sofa'){
    const cw=(W-1.15)/2;
    B(W,.42,.95,col,0,.21,-D/2+.475);B(.95,.42,D-.95,col,W/2-.475,.21,-D/2+.95+(D-.95)/2);
    B(W,.5,.22,'#c4beb4',0,.67,-D/2+.11);B(.2,.3,.95,'#c4beb4',-W/2+.1,.57,-D/2+.475);
    [0,1].forEach(i=>B(cw,.16,.7,'#ece8e1',-W/2+.2+cw/2+i*cw,.5,-D/2+.58));
    B(.8,.16,D-1.15,'#ece8e1',W/2-.475,.5,-D/2+.95+(D-.95)/2);
  }else if(f.t==='chair'){
    B(.55,.12,.55,col,0,.45,0);B(.55,.5,.1,col,0,.76,-.25);
    [[-.22,-.22],[.22,-.22],[-.22,.22],[.22,.22]].forEach(p=>B(.05,.4,.05,'#222',p[0],.2,p[1]));
  }else if(f.t==='lamp'){
    for(let i=0;i<3;i++){const a=i*2.094,m=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,1.1,8),new THREE.MeshStandardMaterial({color:col}));
      m.position.set(Math.sin(a)*.11,.55,Math.cos(a)*.11);m.rotation.set(-.2*Math.cos(a),0,.2*Math.sin(a));g.add(m)}
    const s=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,.45,24,1,true),new THREE.MeshStandardMaterial({color:0xfff6e5,emissive:0xffe2a8,emissiveIntensity:.7,side:THREE.DoubleSide}));
    s.position.y=1.32;g.add(s);
  }else if(f.t==='table'){
    const top=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.06,32),new THREE.MeshStandardMaterial({color:col,roughness:.9}));
    top.scale.set(W/2,1,D/2);top.position.y=.36;g.add(top);
    const base=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.33,32),new THREE.MeshStandardMaterial({color:'#bdb4a8',roughness:.9}));
    base.scale.set(W*.34,1,D*.3);base.position.y=.165;g.add(base);
  }else{
    B(W,.45,D,col,0,.225,0);B(W*.48,.38,.01,'#8a929c',-W*.25,.225,D/2+.005);B(W*.48,.38,.01,'#8a929c',W*.25,.225,D/2+.005);
    B(Math.min(W-.3,1.4),.8,.05,'#0b0f19',0,.9,0);
    if(f.lift)g.position.y=f.lift;
  }
  g.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}});
  const w=new THREE.Group();w.add(g);return w;
}

function loadModel(f){
  return new Promise(res=>{
    if(bad.has(f.id))return res(null);
    if(cache[f.id])return res(cache[f.id].clone(true));
    gl.load(encodeURI(f.glb),g=>{cache[f.id]=g.scene;res(g.scene.clone(true))},undefined,()=>{
      bad.add(f.id);if(!warned){warned=true;toast('找不到 GLB 模型檔，已改用內建程序化家具')}res(null)});
  });
}

/* ---------- 家具操作 ---------- */
async function addItem(f,x,z,r){
  const root=new THREE.Group();root.userData={uid:++uid,fid:f.id};
  let m=await loadModel(f);
  if(m){
    m.scale.setScalar(f.sc||1);m.rotation.y=(f.off||0)*Math.PI/180;m.updateMatrixWorld(true);
    const b=new THREE.Box3().setFromObject(m),c=b.getCenter(new THREE.Vector3());m.position.set(-c.x,-b.min.y,-c.z);
    m.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}});
  }else m=proc(f);
  root.add(m);
  root.position.set(x??(Math.random()-.5)*.6,0,z??(Math.random()-.5)*.6);root.rotation.y=(r||0)*Math.PI/180;
  scene.add(root);items.push(root);clamp(root);stats();return root;
}

function clamp(o){
  const b=new THREE.Box3().setFromObject(o),W=room.w,D=room.d,inWin=Math.abs(o.position.z)<D*.275,maxX=W/2+(inWin?BAL-.1:0);
  let dx=0,dz=0;
  if(b.min.x<-W/2)dx=-W/2-b.min.x;else if(b.max.x>maxX)dx=maxX-b.max.x;
  if(b.min.z<-D/2)dz=-D/2-b.min.z;else if(b.max.z>D/2)dz=D/2-b.max.z;
  o.position.x+=dx;o.position.z+=dz;
}

function select(o){
  sel=o;selBox.visible=!!o;
  $('pill').textContent=o?`已選取：${fOf(o).n}・拖曳移動／雙擊或 ↻ 旋轉`:'點選家具即可拖曳；空白處拖曳旋轉視角';
}
function rot(o){if(!o)return;o.rotation.y+=Math.PI/2;clamp(o);stats()}
function del(o){if(!o)return;scene.remove(o);items.splice(items.indexOf(o),1);if(sel===o)select(null);stats();toast('已移出家具')}
function clearAll(){while(items.length)scene.remove(items.pop());select(null);stats()}

function stats(){
  const b=new THREE.Box3(),v=new THREE.Vector3();let a=0,p=0;
  items.forEach(o=>{b.setFromObject(o).getSize(v);a+=v.x*v.z;p+=fOf(o).price});
  $('s-n').textContent=items.length;$('s-a').textContent=Math.min(100,Math.round(a/(room.w*room.d)*100))+'%';$('s-p').textContent='NT$ '+p.toLocaleString();
  FURN.forEach(f=>{const e=$('c-'+f.id);if(e)e.textContent=items.filter(o=>o.userData.fid===f.id).length});
}

async function aiLayout(st){
  if(!items.length)for(const id of DEF)await addItem(FURN.find(f=>f.id===id));
  const W=room.w,D=room.d,S={
    cozy:{tv:[0,-D/2+.3,0],sofa:[-.3,D/2-1.1,180],table:[0,.1,0],chair:[-W/2+.8,.2,90],lamp:[-W/2+.5,D/2-.5,0]},
    minimalist:{tv:[0,-D/2+.3,0],sofa:[-W/2+1,.2,90],table:[-.3,.2,90],chair:[W/2-.9,-D/2+.9,315],lamp:[-W/2+.4,-D/2+.4,0]},
    lounge:{tv:[-W/2+.3,.6,90],sofa:[.2,-D/2+1,0],table:[.4,-.2,0],chair:[1.3,.5,225],lamp:[1.9,.2,0]}}[st],cnt={};
  items.forEach(o=>{const t=fOf(o).t,n=cnt[t]=(cnt[t]||0)+1,s=S[t];
    o.position.set(s[0]+(n-1)*.6,0,s[1]+(n-1)*.6);o.rotation.y=s[2]*Math.PI/180;clamp(o)});
  stats();$('ai-txt').textContent=TXT[st];
  document.querySelectorAll('.st').forEach(b=>{const on=b.dataset.st===st;b.classList.toggle('on',on);b.classList.toggle('text-cyan-300',on);b.classList.toggle('text-gray-300',!on)});
}

/* ---------- 互動：點選 / 拖曳 / 旋轉 ---------- */
function setRay(e){const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera)}
function pick(e){
  setRay(e);const h=ray.intersectObjects(items,true)[0];if(!h)return null;
  let o=h.object;while(o&&!o.userData.uid)o=o.parent;return o;
}
function bindInput(){
  const cv=renderer.domElement;
  cv.addEventListener('pointerdown',e=>{
    const o=pick(e);down={x:e.clientX,y:e.clientY,hit:!!o};
    if(o){select(o);ray.ray.intersectPlane(plane,hit);drag={o,dx:o.position.x-hit.x,dz:o.position.z-hit.z};controls.enabled=false}
  },true);
  window.addEventListener('pointermove',e=>{
    if(!drag)return;setRay(e);
    if(ray.ray.intersectPlane(plane,hit)){drag.o.position.set(hit.x+drag.dx,0,hit.z+drag.dz);clamp(drag.o)}
  });
  window.addEventListener('pointerup',e=>{
    if(drag){drag=null;controls.enabled=true;stats()}
    else if(down&&!down.hit&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<6)select(null);
    down=null;
  });
  cv.addEventListener('dblclick',e=>rot(pick(e)));
  cv.addEventListener('wheel',e=>{if(drag){e.preventDefault();drag.o.rotation.y+=(e.deltaY>0?1:-1)*Math.PI/12}},{passive:false});
  window.addEventListener('keydown',e=>{if(e.key==='Delete'||e.key==='Backspace')del(sel);if(e.key==='r'||e.key==='R')rot(sel)});
}

/* ---------- 鏡頭預設 ---------- */
const VIEWS={
  ov:()=>[[0,3.6,room.d/2+3.4],[0,.5,0]],
  top:()=>[[0,Math.max(room.w,room.d)*1.5,.01],[0,0,0]],
  sofa:()=>[[0,1.3,room.d/2-.1],[0,.7,-room.d/2]],
  bal:()=>[[room.w/2+1.6,1.6,0],[-1,.6,0]]
};
function goView(k){const [p,t]=VIEWS[k]();tw={p0:camera.position.clone(),t0:controls.target.clone(),p1:new THREE.Vector3(...p),t1:new THREE.Vector3(...t),k:0}}

/* ---------- UI ---------- */
function ui(){
  FURN.forEach(f=>{
    const b=document.createElement('button');b.className='gb rounded-xl p-2 text-left flex items-center space-x-2';
    b.innerHTML=`<i class="fa-solid ${f.ic} text-cyan-300 text-lg w-6 text-center"></i><div class="min-w-0 flex-1"><div class="text-[11px] font-bold truncate">${f.n}</div><div class="text-[10px] text-gray-400">NT$ ${f.price.toLocaleString()}・已置入 <b id="c-${f.id}" class="text-cyan-300">0</b></div></div><i class="fa-solid fa-plus text-cyan-400"></i>`;
    b.onclick=async()=>{const o=await addItem(f);select(o);toast(`已在客廳中央置入 ${f.n}`)};
    $('p-furn').appendChild(b);
  });
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-tab]').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.classList.toggle('text-cyan-300',on);x.classList.toggle('text-gray-400',!on)});
    document.querySelectorAll('[data-pn]').forEach(p=>p.classList.toggle('hidden',p.dataset.pn!==b.dataset.tab));
  });
  $('tg').onclick=()=>$('bd').classList.toggle('hidden');
  document.querySelectorAll('.vb').forEach(b=>b.onclick=()=>goView(b.dataset.v));
  document.querySelectorAll('.st').forEach(b=>b.onclick=()=>aiLayout(b.dataset.st));
  $('b-rot').onclick=()=>sel?rot(sel):toast('請先點選一件家具');
  $('b-del').onclick=()=>sel?del(sel):toast('請先點選一件家具');
  $('sun-r').oninput=e=>setSun(+e.target.value);
  const resize=()=>{room.w=+$('rw').value;room.d=+$('rd').value;$('rw-v').textContent=room.w.toFixed(1)+' m';$('rd-v').textContent=room.d.toFixed(1)+' m';buildRoom();items.forEach(clamp);stats()};
  $('rw').oninput=$('rd').oninput=resize;
  $('b-clr').onclick=()=>{clearAll();toast('已清空客廳')};
  const dump=()=>JSON.stringify({w:room.w,d:room.d,it:items.map(o=>({id:o.userData.fid,x:+o.position.x.toFixed(2),z:+o.position.z.toFixed(2),r:Math.round(o.rotation.y*180/Math.PI)}))});
  $('b-save').onclick=()=>{try{localStorage.setItem('ss-room',dump());toast('佈置已儲存')}catch(e){toast('此環境無法儲存')}};
  $('b-json').onclick=()=>{try{navigator.clipboard.writeText(dump());toast('佈置 JSON 已複製')}catch(e){toast('無法複製')}};
  $('b-load').onclick=async()=>{
    let d;try{d=JSON.parse(localStorage.getItem('ss-room'))}catch(e){}
    if(!d)return toast('沒有已儲存的佈置');
    clearAll();$('rw').value=d.w;$('rd').value=d.d;resize();
    for(const i of d.it){const f=FURN.find(x=>x.id===i.id);if(f)await addItem(f,i.x,i.z,i.r)}
    toast('已讀取佈置');
  };
}

window.addEventListener('load',async()=>{init();ui();select(null);await aiLayout('cozy');toast('點選家具後可拖曳；在「家具庫」加入更多')});
</script>
